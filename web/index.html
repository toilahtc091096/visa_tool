<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khai hồ sơ visa</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #1d2330; --muted: #667085; --line: #d9dde5;
    --accent: #1f6feb; --accent-text: #fff; --ok-bg: #e8f6ee; --ok: #116b3a; --err-bg: #fdecec; --err: #a4161a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2129; --text: #e6e8ec; --muted: #9aa3b2; --line: #333a46;
            --accent: #4c8dff; --ok-bg: #12301f; --ok: #7fd6a2; --err-bg: #3a1618; --err: #ff9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 7px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: wait; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--muted); }
  .bar button { margin: 0; padding: 6px 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { margin: 0; background: transparent; color: var(--text); border: 1px solid var(--line); }
  .tabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 7px; white-space: pre-wrap; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Khai hồ sơ visa</h1>

  <section id="login" class="card hidden">
    <label for="u">Tên đăng nhập</label>
    <input id="u" autocomplete="username">
    <label for="p">Mật khẩu</label>
    <input id="p" type="password" autocomplete="current-password">
    <button id="loginBtn">Đăng nhập</button>
    <div id="loginMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div class="bar"><span id="who"></span><button class="secondary" id="logout">Đăng xuất</button></div>
    <div class="tabs">
      <button id="tabStart" class="on">Khởi chạy hồ sơ</button>
      <button id="tabRerun">Chạy lại hồ sơ</button>
    </div>

    <div id="startCard" class="card">
      <label for="house">Nhà</label>
      <select id="house"></select>
      <div class="row">
        <div>
          <label for="visa">Loại visa</label>
          <select id="visa"></select>
        </div>
        <div>
          <label for="days">Số ngày <span class="hint" id="daysHint"></span></label>
          <input id="days" inputmode="numeric">
        </div>
      </div>
      <div id="relationBox">
        <label for="relation">Quan hệ <span class="hint">người mời là gì của người xin visa</span></label>
        <select id="relation"></select>
      </div>
      <label for="prefix">Thư mục hồ sơ trên R2 <span class="hint">chép đúng tên thư mục</span></label>
      <input id="prefix" placeholder="vd: L30 - NGUYEN VAN A">
      <button id="startBtn">Gửi</button>
      <div id="startMsg"></div>
    </div>

    <div id="rerunCard" class="card hidden">
      <p class="hint">Xoá thư mục số hộ chiếu (kết quả lần chạy trước) và đưa thư mục gốc từ lưu trữ về lại. Bấm <b>Kiểm tra</b> trước, đúng rồi mới <b>Thực hiện</b>. Sau đó khởi chạy lại hồ sơ ở tab bên cạnh.</p>
      <label for="rHouse">Nhà</label>
      <select id="rHouse"></select>
      <label for="rPrefix">Thư mục hồ sơ</label>
      <input id="rPrefix">
      <label for="rPassport">Số hộ chiếu</label>
      <input id="rPassport" autocapitalize="characters">
      <div style="display:flex; gap:8px">
        <button id="checkBtn" class="secondary">Kiểm tra</button>
        <button id="doBtn" disabled>Thực hiện</button>
      </div>
      <div id="rerunMsg"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: () => { try { return localStorage.getItem('visa_web_key') || ''; } catch (e) { return ''; } },
  set: (v) => { try { v ? localStorage.setItem('visa_web_key', v) : localStorage.removeItem('visa_web_key'); } catch (e) {} },
};
let key = store.get();
let relationRequired = [];

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': key },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  const d = data.detail || data;
  if (res.status === 401 && path !== '/web/login') { logout(); }
  if (!res.ok || d.ok === false) throw new Error(d.error || d.message || `Lỗi ${res.status}`);
  return d;
}

function show(el, text, ok) { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = text; }
function fill(sel, items) { sel.innerHTML = items.map((x) => `<option value="${x.value ?? x}">${x.label ?? x}</option>`).join(''); }

function render(info) {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = `${info.username} (${info.staff})`;
  fill($('house'), info.houses); fill($('rHouse'), info.houses);
  fill($('visa'), info.visa_codes);
  fill($('relation'), [{ value: '', label: '— không —' }, ...info.relations]);
  relationRequired = info.relation_required || [];
  onVisa();
}

function logout() {
  key = ''; store.set('');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}

const DAYS_HINT = { L: '15 hoặc 30', M: '15/30/90, trống = 90', F: '15/30/90, trống = 15', X1: '> 180', X2: '1–180', Q1: 'tuỳ chọn', Q2: 'tuỳ chọn', S2: 'tuỳ chọn' };
function onVisa() {
  const v = $('visa').value;
  $('daysHint').textContent = DAYS_HINT[v] || '';
  $('relationBox').style.display = (relationRequired.includes(v) || v === 'S2') ? '' : 'none';
  if (!(relationRequired.includes(v) || v === 'S2')) $('relation').value = '';
}
$('visa').addEventListener('change', onVisa);

$('loginBtn').onclick = async () => {
  const b = $('loginBtn'); b.disabled = true;
  try {
    const info = await api('/web/login', { username: $('u').value, password: $('p').value });
    key = info.api_key; store.set(key); $('p').value = ''; $('loginMsg').className = ''; $('loginMsg').textContent = '';
    render(info);
  } catch (e) { show($('loginMsg'), e.message, false); }
  b.disabled = false;
};
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logout').onclick = logout;

$('tabStart').onclick = () => { $('tabStart').classList.add('on'); $('tabRerun').classList.remove('on'); $('startCard').classList.remove('hidden'); $('rerunCard').classList.add('hidden'); };
$('tabRerun').onclick = () => { $('tabRerun').classList.add('on'); $('tabStart').classList.remove('on'); $('rerunCard').classList.remove('hidden'); $('startCard').classList.add('hidden'); };

$('startBtn').onclick = async () => {
  const b = $('startBtn'); b.disabled = true;
  try {
    const r = await api('/web/start', {
      house: $('house').value, visa_code: $('visa').value, days: $('days').value.trim(),
      relation: $('relation').value, source_prefix: $('prefix').value,
    });
    show($('startMsg'), `Đã gửi: ${r.job_id}\nNhà ${r.house} · ${r.visa_type} · ${r.source_prefix}\nKết quả sẽ về Telegram như thường lệ.`, true);
    $('prefix').value = '';
  } catch (e) { show($('startMsg'), e.message, false); }
  b.disabled = false;
};

function fmt(s) { return s ? `${s.files} file, ${(s.bytes / 1048576).toFixed(2)} MB` : 'không có'; }
async function rerun(confirm) {
  const body = { house: $('rHouse').value, source_prefix: $('rPrefix').value, passport_number: $('rPassport').value, confirm };
  const btn = confirm ? $('doBtn') : $('checkBtn'); btn.disabled = true;
  try {
    const r = await api('/web/rerun', body);
    show($('rerunMsg'), (confirm ? 'ĐÃ THỰC HIỆN.\n' : 'Kiểm tra (chưa thay đổi gì):\n') +
      `Khôi phục: ${r.archive || '(thư mục gốc vẫn còn)'} → ${fmt(r.restore)}\n` +
      `Xoá thư mục đầu ra: ${r.delete_output?.prefix} → ${fmt(r.delete_output)}`, true);
    $('doBtn').disabled = confirm;
  } catch (e) { show($('rerunMsg'), e.message, false); $('doBtn').disabled = true; }
  if (!confirm) btn.disabled = false;
}
$('checkBtn').onclick = () => rerun(false);
$('doBtn').onclick = () => rerun(true);
['rHouse', 'rPrefix', 'rPassport'].forEach((id) => $(id).addEventListener('input', () => { $('doBtn').disabled = true; }));

(async () => {
  if (!key) { logout(); return; }
  try { render(await api('/web/me')); } catch (e) { logout(); }
})();
</script>
</body>
</html>
